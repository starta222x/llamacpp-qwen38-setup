name: Build FastMTP llama.cpp - Windows CUDA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLAMA_REPO: https://github.com/ggml-org/llama.cpp.git
  LLAMA_COMMIT: 4df29be4f4c3673f428170fda944a5b19f743bb8

  FAST_MTP_PATCH_URL: https://huggingface.co/HauhauCS/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF/resolve/main/HauhauCS-FastMTP-llama.cpp.patch

  # RTX 4090 = Ada Lovelace = SM 89
  CUDA_ARCH: "89"

  # Keep this explicit so the build is reproducible.
  CUDA_VERSION: "13.3.0"

jobs:
  build:
    # Do NOT use ${{ env.* }} here.
    # GitHub Actions does not expose job-level env in this field.
    name: Windows x64 / CUDA 13.3 / SM 89
    runs-on: windows-2022

    steps:

      # ============================================================
      # 1. Checkout this repository
      # ============================================================

      - name: Checkout setup repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Setup MSVC
      # ============================================================

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64


      # ============================================================
      # 3. Install CUDA Toolkit
      # ============================================================

      - name: Setup CUDA
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network


      # ============================================================
      # 4. Verify compiler environment
      # ============================================================

      - name: Verify build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== CMake ==="
          cmake --version

          Write-Host ""
          Write-Host "=== Ninja ==="
          ninja --version

          Write-Host ""
          Write-Host "=== NVCC ==="
          nvcc --version

          Write-Host ""
          Write-Host "=== CUDA_PATH ==="
          Write-Host $env:CUDA_PATH

          Write-Host ""
          Write-Host "=== MSVC ==="
          if ($env:VCToolsInstallDir) {
              Write-Host $env:VCToolsInstallDir
          }
          else {
              Write-Host "VCToolsInstallDir is not set."
          }


      # ============================================================
      # 5. Install Ninja
      # ============================================================

      - name: Install Ninja
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          choco install ninja --no-progress -y

          ninja --version


      # ============================================================
      # 6. Clone exact llama.cpp commit
      # ============================================================

      - name: Clone llama.cpp
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          git clone `
            --filter=blob:none `
            "${env:LLAMA_REPO}" `
            llama.cpp

          Set-Location llama.cpp

          git fetch `
            --depth 1 `
            origin `
            "${env:LLAMA_COMMIT}"

          git checkout "${env:LLAMA_COMMIT}"

          Write-Host ""
          Write-Host "=== llama.cpp commit ==="

          $actualCommit = git rev-parse HEAD

          Write-Host $actualCommit

          if ($actualCommit -ne "${env:LLAMA_COMMIT}") {
              throw "Unexpected llama.cpp commit."
          }


      # ============================================================
      # 7. Download HauhauCS FastMTP patch
      # ============================================================

      - name: Download FastMTP patch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Invoke-WebRequest `
            -Uri "${env:FAST_MTP_PATCH_URL}" `
            -OutFile "HauhauCS-FastMTP-llama.cpp.patch"

          if (!(Test-Path "HauhauCS-FastMTP-llama.cpp.patch")) {
              throw "FastMTP patch was not downloaded."
          }

          $size = (Get-Item "HauhauCS-FastMTP-llama.cpp.patch").Length

          Write-Host "Patch size: $size bytes"


      # ============================================================
      # 8. Verify patch
      # ============================================================

      - name: Check FastMTP patch
        shell: powershell
        working-directory: llama.cpp
        run: |
          $ErrorActionPreference = "Stop"

          git apply --check `
            ../HauhauCS-FastMTP-llama.cpp.patch

          if ($LASTEXITCODE -ne 0) {
              throw "FastMTP patch cannot be applied to the pinned llama.cpp commit."
          }

          Write-Host "FastMTP patch check passed."


      # ============================================================
      # 9. Apply FastMTP patch
      # ============================================================

      - name: Apply FastMTP patch
        shell: powershell
        working-directory: llama.cpp
        run: |
          $ErrorActionPreference = "Stop"

          git apply `
            ../HauhauCS-FastMTP-llama.cpp.patch

          if ($LASTEXITCODE -ne 0) {
              throw "FastMTP patch failed."
          }

          Write-Host "FastMTP patch applied."


      # ============================================================
      # 10. Configure CMake
      # ============================================================

      - name: Configure CMake
        shell: powershell
        working-directory: llama.cpp
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            -S . `
            -B build `
            -G "Ninja Multi-Config" `
            -DGGML_CUDA=ON `
            -DGGML_NATIVE=OFF `
            -DCMAKE_CUDA_ARCHITECTURES=${env:CUDA_ARCH} `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_CLI=ON `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_EXAMPLES=OFF

          if ($LASTEXITCODE -ne 0) {
              throw "CMake configuration failed."
          }


      # ============================================================
      # 11. Build llama-server
      # ============================================================

      - name: Build llama-server
        shell: powershell
        working-directory: llama.cpp
        run: |
          $ErrorActionPreference = "Stop"

          $jobs = [Math]::Max(
              1,
              [Environment]::ProcessorCount - 1
          )

          Write-Host "Build jobs: $jobs"

          cmake `
            --build build `
            --config Release `
            --target llama-server `
            --parallel $jobs

          if ($LASTEXITCODE -ne 0) {
              throw "llama-server build failed."
          }


      # ============================================================
      # 12. Build llama-cli
      # ============================================================

      - name: Build llama-cli
        shell: powershell
        working-directory: llama.cpp
        run: |
          $ErrorActionPreference = "Stop"

          $jobs = [Math]::Max(
              1,
              [Environment]::ProcessorCount - 1
          )

          cmake `
            --build build `
            --config Release `
            --target llama-cli `
            --parallel $jobs

          if ($LASTEXITCODE -ne 0) {
              throw "llama-cli build failed."
          }


      # ============================================================
      # 13. Locate binaries
      # ============================================================

      - name: Locate binaries
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== llama-server.exe ==="

          Get-ChildItem `
            -Path llama.cpp/build `
            -Filter llama-server.exe `
            -Recurse |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "=== llama-cli.exe ==="

          Get-ChildItem `
            -Path llama.cpp/build `
            -Filter llama-cli.exe `
            -Recurse |
            Select-Object FullName, Length


      # ============================================================
      # 14. Verify llama-server binary
      # ============================================================

      - name: Verify llama-server
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $server = Get-ChildItem `
            -Path llama.cpp/build `
            -Filter llama-server.exe `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $server) {
              throw "llama-server.exe was not found."
          }

          Write-Host "Server:"
          Write-Host $server.FullName

          & $server.FullName --version

          if ($LASTEXITCODE -ne 0) {
              throw "llama-server --version failed."
          }


      # ============================================================
      # 15. Inspect CUDA dependencies
      # ============================================================

      - name: Inspect CUDA dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $server = Get-ChildItem `
            -Path llama.cpp/build `
            -Filter llama-server.exe `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $server) {
              throw "llama-server.exe not found."
          }

          Write-Host "=== DLL dependencies ==="

          & dumpbin.exe /DEPENDENTS $server.FullName


      # ============================================================
      # 16. Prepare distribution directory
      # ============================================================

      - name: Prepare package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $package = Join-Path `
            $env:GITHUB_WORKSPACE `
            "llama-fastmtp-windows-x64"

          if (Test-Path $package) {
              Remove-Item `
                $package `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $package |
            Out-Null

          # --------------------------------------------------------
          # Copy all Release binaries/DLLs generated by llama.cpp
          # --------------------------------------------------------

          $releaseDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "llama.cpp\build\bin\Release"

          if (!(Test-Path $releaseDir)) {
              throw "Release directory not found: $releaseDir"
          }

          Copy-Item `
            "$releaseDir\*" `
            $package `
            -Recurse `
            -Force

          # --------------------------------------------------------
          # Copy CUDA runtime DLLs that are present.
          #
          # We only copy DLLs that actually exist in CUDA_PATH\bin.
          # Missing files are not treated as an error.
          # --------------------------------------------------------

          $cudaBin = Join-Path `
            $env:CUDA_PATH `
            "bin"

          $cudaDllPatterns = @(
              "cudart64_*.dll",
              "cublas64_*.dll",
              "cublasLt64_*.dll",
              "nvrtc64_*.dll",
              "nvrtc-builtins64_*.dll"
          )

          foreach ($pattern in $cudaDllPatterns) {
              Get-ChildItem `
                -Path $cudaBin `
                -Filter $pattern `
                -File `
                -ErrorAction SilentlyContinue |
                ForEach-Object {
                    Copy-Item `
                        $_.FullName `
                        $package `
                        -Force

                    Write-Host "Copied CUDA DLL: $($_.Name)"
                }
          }

          # --------------------------------------------------------
          # Copy LICENSE
          # --------------------------------------------------------

          Copy-Item `
            "$env:GITHUB_WORKSPACE\llama.cpp\LICENSE" `
            "$package\LICENSE.txt" `
            -Force

          # --------------------------------------------------------
          # Build information
          # --------------------------------------------------------

          @"
          llama.cpp FastMTP Windows x64 build

          llama.cpp repository:
          ${env:LLAMA_REPO}

          llama.cpp commit:
          ${env:LLAMA_COMMIT}

          FastMTP patch:
          HauhauCS-FastMTP-llama.cpp.patch

          CUDA:
          ${env:CUDA_VERSION}

          CUDA architecture:
          SM ${env:CUDA_ARCH}

          Platform:
          Windows x64

          Runner:
          windows-2022

          Build:
          GitHub Actions

          NOTE:
          This package does not contain Qwen3.8 GGUF model files.
          This package does not contain the FastMTP model sidecar.
          "@ | Set-Content `
              "$package\BUILD_INFO.txt" `
              -Encoding UTF8


      # ============================================================
      # 17. Show package contents
      # ============================================================

      - name: Inspect package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Package ==="

          Get-ChildItem `
            "llama-fastmtp-windows-x64" `
            -File |
            Sort-Object Name |
            Select-Object Name, Length


      # ============================================================
      # 18. Verify required executables
      # ============================================================

      - name: Verify package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $package = `
            "$env:GITHUB_WORKSPACE\llama-fastmtp-windows-x64"

          $server = `
            Join-Path $package "llama-server.exe"

          if (!(Test-Path $server)) {
              throw "llama-server.exe missing from package."
          }

          $cli = `
            Join-Path $package "llama-cli.exe"

          if (!(Test-Path $cli)) {
              throw "llama-cli.exe missing from package."
          }

          Write-Host "llama-server.exe: OK"
          Write-Host "llama-cli.exe:    OK"


      # ============================================================
      # 19. Create ZIP
      # ============================================================

      - name: Create ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zip = `
            "$env:GITHUB_WORKSPACE\llama-fastmtp-windows-x64.zip"

          if (Test-Path $zip) {
              Remove-Item `
                $zip `
                -Force
          }

          Compress-Archive `
            -Path "llama-fastmtp-windows-x64\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          Write-Host ""
          Write-Host "=== ZIP ==="

          Get-Item $zip |
            Select-Object Name, Length


      # ============================================================
      # 20. Upload artifact
      # ============================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-fastmtp-windows-x64-cuda13-sm89
          path: llama-fastmtp-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30