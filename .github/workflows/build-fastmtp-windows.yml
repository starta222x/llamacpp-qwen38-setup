name: Build FastMTP Windows CUDA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLAMA_REPO: https://github.com/ggml-org/llama.cpp.git
  LLAMA_COMMIT: 4df29be4f4c3673f428170fda944a5b19f743bb8

  FAST_MTP_PATCH_URL: https://huggingface.co/HauhauCS/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF/resolve/main/HauhauCS-FastMTP-llama.cpp.patch

  CUDA_VERSION: 13.3.0
  CUDA_ARCH: 89

jobs:
  build:
    name: Windows CUDA ${{ env.CUDA_VERSION }} sm_${{ env.CUDA_ARCH }}
    runs-on: windows-2022

    steps:

      # ------------------------------------------------------------
      # 1. Checkout workflow repository
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Install CUDA 13.3.0 directly from NVIDIA
      #
      # Do NOT use Jimver/cuda-toolkit here.
      # ------------------------------------------------------------
      - name: Download CUDA installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cudaVersion = "${{ env.CUDA_VERSION }}"

          $cudaUrl = "https://developer.download.nvidia.com/compute/cuda/$cudaVersion/local_installers/cuda_${cudaVersion}_windows.exe"

          $installer = "$env:RUNNER_TEMP\cuda_${cudaVersion}_windows.exe"

          Write-Host "CUDA URL:"
          Write-Host $cudaUrl

          Write-Host "Downloading CUDA installer..."

          Invoke-WebRequest `
            -Uri $cudaUrl `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path $installer)) {
            throw "CUDA installer was not downloaded."
          }

          $sizeGB = (Get-Item $installer).Length / 1GB

          Write-Host ("Downloaded CUDA installer: {0:N2} GB" -f $sizeGB)

          "CUDA_INSTALLER=$installer" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      # ------------------------------------------------------------
      # 3. Install CUDA silently
      # ------------------------------------------------------------
      - name: Install CUDA
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"

          $installer = $env:CUDA_INSTALLER

          Write-Host "Installing CUDA:"
          Write-Host $installer

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "-s" `
            -Wait `
            -PassThru

          Write-Host "CUDA installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            throw "CUDA installer failed with exit code $($process.ExitCode)"
          }

      # ------------------------------------------------------------
      # 4. Locate CUDA
      # ------------------------------------------------------------
      - name: Configure CUDA environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ env.CUDA_VERSION }}"

          if (-not (Test-Path $cudaPath)) {
            throw "CUDA installation directory not found: $cudaPath"
          }

          $nvcc = Join-Path $cudaPath "bin\nvcc.exe"

          if (-not (Test-Path $nvcc)) {
            throw "nvcc not found: $nvcc"
          }

          Write-Host "CUDA_PATH=$cudaPath"
          Write-Host "nvcc=$nvcc"

          "CUDA_PATH=$cudaPath" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "$cudaPath\bin" | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

      # ------------------------------------------------------------
      # 5. Verify CUDA
      # ------------------------------------------------------------
      - name: Verify CUDA
        shell: cmd
        run: |
          where nvcc
          nvcc --version

      # ------------------------------------------------------------
      # 6. Verify NVIDIA driver / GPU
      # ------------------------------------------------------------
      - name: Verify GPU
        shell: cmd
        run: |
          nvidia-smi
          nvidia-smi --query-gpu=name,compute_cap --format=csv

      # ------------------------------------------------------------
      # 7. Clone llama.cpp
      # ------------------------------------------------------------
      - name: Clone llama.cpp
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git clone "${{ env.LLAMA_REPO }}" llama.cpp

          Set-Location llama.cpp

          git checkout "${{ env.LLAMA_COMMIT }}"

          Write-Host "llama.cpp commit:"
          git rev-parse HEAD

      # ------------------------------------------------------------
      # 8. Download FastMTP patch
      # ------------------------------------------------------------
      - name: Download FastMTP patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $patch = "$env:RUNNER_TEMP\fastmtp.patch"

          Invoke-WebRequest `
            -Uri "${{ env.FAST_MTP_PATCH_URL }}" `
            -OutFile $patch `
            -UseBasicParsing

          if (-not (Test-Path $patch)) {
            throw "FastMTP patch was not downloaded."
          }

          Write-Host "Patch downloaded:"
          Write-Host $patch

          "FAST_MTP_PATCH=$patch" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      # ------------------------------------------------------------
      # 9. Apply FastMTP patch
      # ------------------------------------------------------------
      - name: Apply FastMTP patch
        shell: pwsh
        working-directory: llama.cpp
        run: |
          $ErrorActionPreference = "Stop"

          git apply --check "$env:FAST_MTP_PATCH"

          git apply --verbose "$env:FAST_MTP_PATCH"

          Write-Host ""
          Write-Host "FastMTP patch applied successfully."
          Write-Host ""

          git status --short

      # ------------------------------------------------------------
      # 10. Install Ninja
      # ------------------------------------------------------------
      - name: Install Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install ninja --no-progress -y

          ninja --version

      # ------------------------------------------------------------
      # 11. Configure MSVC
      # ------------------------------------------------------------
      - name: Configure Visual Studio
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          where cl
          cl

      # ------------------------------------------------------------
      # 12. Configure CMake
      # ------------------------------------------------------------
      - name: Configure CMake
        shell: cmd
        working-directory: llama.cpp
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          cmake ^
            -S . ^
            -B build ^
            -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CPU=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=${{ env.CUDA_ARCH }} ^
            -DCMAKE_CUDA_COMPILER="%CUDA_PATH%\bin\nvcc.exe" ^
            -DCMAKE_BUILD_TYPE=Release

      # ------------------------------------------------------------
      # 13. Build
      # ------------------------------------------------------------
      - name: Build llama.cpp
        shell: cmd
        working-directory: llama.cpp
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1

          if %NINJA_JOBS% LSS 1 set NINJA_JOBS=1

          echo Building with %NINJA_JOBS% jobs

          cmake --build build ^
            --config Release ^
            -j %NINJA_JOBS%

      # ------------------------------------------------------------
      # 14. List build output
      # ------------------------------------------------------------
      - name: Inspect build
        shell: pwsh
        working-directory: llama.cpp
        run: |
          Write-Host ""
          Write-Host "===== BUILD OUTPUT ====="
          Write-Host ""

          Get-ChildItem `
            -Path "build\bin\Release" `
            -File `
            | Select-Object Name, Length

          Write-Host ""
          Write-Host "===== CUDA DLLs ====="
          Write-Host ""

          Get-ChildItem `
            -Path "build\bin\Release" `
            -Filter "*.dll" `
            -File `
            | Select-Object Name, Length

      # ------------------------------------------------------------
      # 15. Basic llama-server verification
      # ------------------------------------------------------------
      - name: Verify llama-server
        shell: cmd
        working-directory: llama.cpp
        run: |
          build\bin\Release\llama-server.exe --help > "%TEMP%\llama-server-help.txt"

          if errorlevel 1 (
            type "%TEMP%\llama-server-help.txt"
            exit /b 1
          )

          findstr /I "CUDA" "%TEMP%\llama-server-help.txt" || exit /b 0

      # ------------------------------------------------------------
      # 16. Package
      # ------------------------------------------------------------
      - name: Package
        shell: pwsh
        working-directory: llama.cpp
        run: |
          $ErrorActionPreference = "Stop"

          $package = "$env:GITHUB_WORKSPACE\llama-fastmtp-windows-cuda-${{ env.CUDA_VERSION }}-sm${{ env.CUDA_ARCH }}.zip"

          $files = @(
            "build\bin\Release\*.exe",
            "build\bin\Release\*.dll"
          )

          $stage = "$env:RUNNER_TEMP\llama-fastmtp"

          if (Test-Path $stage) {
            Remove-Item $stage -Recurse -Force
          }

          New-Item -ItemType Directory -Path $stage | Out-Null

          foreach ($pattern in $files) {
            Get-ChildItem `
              -Path $pattern `
              -File `
              -ErrorAction SilentlyContinue `
              | Copy-Item -Destination $stage
          }

          Copy-Item `
            -Path "LICENSE" `
            -Destination $stage `
            -ErrorAction SilentlyContinue

          Compress-Archive `
            -Path "$stage\*" `
            -DestinationPath $package `
            -Force

          Write-Host ""
          Write-Host "Package:"
          Write-Host $package

          Get-Item $package | Select-Object Name, Length

      # ------------------------------------------------------------
      # 17. Upload artifact
      # ------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-fastmtp-windows-cuda-${{ env.CUDA_VERSION }}-sm${{ env.CUDA_ARCH }}
          path: llama-fastmtp-windows-cuda-${{ env.CUDA_VERSION }}-sm${{ env.CUDA_ARCH }}.zip
          if-no-files-found: error
          retention-days: 14